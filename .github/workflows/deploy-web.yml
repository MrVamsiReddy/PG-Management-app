name: Deploy web apps

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Build & publish to GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      # The production builds, never the combined dev app (lib/main.dart):
      #   /PG-Management-app/        tenant app (invite links point here)
      #   /PG-Management-app/owner/  owner + admin app
      - run: flutter build web --release -t lib/main_tenant.dart --base-href "/PG-Management-app/"
      - run: flutter build web --release -t lib/main_owner.dart --base-href "/PG-Management-app/owner/" --output "$GITHUB_WORKSPACE/build/web-owner"
      - run: cp -r build/web-owner build/web/owner
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web
      - id: deployment
        uses: actions/deploy-pages@v4
